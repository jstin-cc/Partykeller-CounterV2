<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung Kopf 2</title>
<link rel="stylesheet" href="../../public/css/theme.css">
<style>
  body { padding: 48px clamp(16px, 4vw, 56px) 80px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
  .stage { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; }
  .variant { display: flex; flex-direction: column; gap: 14px; }
  .variant-head { display: flex; flex-direction: column; gap: 6px; width: 375px; }
  .variant-head .t-h3 { font-size: 18px; }
  .variant-head .eyebrow { color: var(--ink-muted); line-height: 1.4; }
  .variant-head .eyebrow.ok { color: var(--accent-text); }

  .phone {
    position: relative; width: 375px; height: 470px; flex: none; overflow: hidden;
    border-radius: 28px; border: 1px solid var(--line-strong); background: var(--bg);
  }
  .phone > .topo { z-index: 0; }
  .screen { position: absolute; inset: 0; z-index: 1; overflow: hidden; padding: 14px 20px 0; display: flex; flex-direction: column; }

  /* ---------- wie die echte Seite (D-126, D-127) ---------- */
  .bar { display: flex; justify-content: space-between; align-items: center; min-height: 48px; flex: none; }
  .bar .wordmark { font-size: 21px; }
  .bar-r { display: flex; align-items: center; gap: 12px; }
  .pk-logo {
    display: block; flex: none; width: 52px; aspect-ratio: 1181 / 1000; background: var(--ink);
    -webkit-mask: url('../../public/assets/logo.png') center / contain no-repeat;
    mask: url('../../public/assets/logo.png') center / contain no-repeat;
  }
  .head { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 22px 0 16px; flex: none; }
  .login-title { font-size: 34px; line-height: 0.86; white-space: nowrap; }
  .user-list { position: relative; border-top: 1px solid var(--line); }
  .user-item { position: relative; border-bottom: 1px solid var(--line); }
  .user-row { display: flex; align-items: center; gap: 14px; min-height: 74px; padding: 12px 8px; color: var(--ink); }
  .user-name { flex: 1; min-width: 0; font-weight: 800; font-size: 27.75px; line-height: 0.92; letter-spacing: -0.035em; text-transform: uppercase; }
  .user-go { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; }
  .user-go .i-arrow { width: 12px; height: 12px; }
  .avatar-wrap { position: relative; flex: none; display: flex; }
  .here-dot { position: absolute; right: -1px; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2.5px var(--bg); }

  /* =====================================================================
     H1 · Wer ist da – Legende zum Punkt, rechts in der Titelzeile
     ===================================================================== */
  .here-count { display: flex; align-items: center; gap: 8px; padding-bottom: 3px; color: var(--ink-muted); white-space: nowrap; }
  .here-count i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .here-count .num { font-size: 20px; line-height: 0.8; color: var(--ink); }
  .here-count .eyebrow { padding-top: 2px; }

  /* =====================================================================
     H2 · Laufband – der Titel läuft langsam durch, gleiche Höhe
     ===================================================================== */
  .h2 .head { margin: 0 -20px; padding-left: 0; padding-right: 0; }
  .h2 .marquee { width: 100%; --marquee-speed: 26; }
  .h2 .marquee-track > span { display: inline-flex; align-items: center; }
  .h2 .login-title .sep { font-family: var(--font-serif); font-weight: 400; color: var(--accent-text); font-size: 1.1em; margin: 0 0.32em; text-transform: none; }

  /* =====================================================================
     H3 · Wochentag in der Serif
     ===================================================================== */
  .day { font-family: var(--font-serif); font-size: 30px; line-height: 0.8; color: var(--accent-text); padding-bottom: 1px; }

  /* =====================================================================
     H4 · Reiter – die Linie über der Liste hebt sich um den Titel
     ===================================================================== */
  .h4 .head { padding: 12px 2px 12px 16px; margin-top: 10px; }
  .h4 .user-list { border-top: 0; }
  .tab-line { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; width: 100%; overflow: visible; pointer-events: none; }
  .tab-line path { fill: none; stroke: var(--line-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .tab-fill { position: absolute; left: 0; bottom: 0; height: 100%; pointer-events: none; background: var(--surface); }
  .h4 .head > :not(svg):not(.tab-fill) { position: relative; z-index: 1; }

  /* =====================================================================
     H5 · Umriss füllt sich (Idee D5) – nur Bewegung
     ===================================================================== */
  .h5 .login-title { position: relative; color: var(--bg); -webkit-text-stroke: 1.2px var(--ink-faint); paint-order: stroke fill; }
  .h5 .login-title .fill { position: absolute; inset: 0; color: var(--ink); -webkit-text-stroke: 0; clip-path: inset(0 100% 0 0); }
  .h5.play .login-title .fill { animation: fill-in 1.1s var(--ease) 0.3s forwards; }
  @keyframes fill-in { to { clip-path: inset(0 0 0 0); } }
</style>
</head>
<body>

<header class="page-head">
  <div>
    <p class="eyebrow">Entwurf · Anmeldeseite</p>
    <h1 class="t-title">Kopf, <span class="t-serif t-accent">Runde zwei</span></h1>
  </div>
  <button id="replay" class="btn btn--ghost btn--sm" type="button">Bewegung abspielen <span class="i-arrow"></span></button>
</header>

<div class="stage" id="stage"></div>

<template id="phone-tpl">
  <div class="phone">
    <div class="topo topo--abs" aria-hidden="true"></div>
    <div class="screen">
      <div class="bar">
        <span class="wordmark"><span class="wm-top">Party</span><span class="wm-bottom">Keller</span></span>
        <div class="bar-r"><span class="pk-logo"></span><span class="btn btn--ghost btn--icon"><span class="i-menu"></span></span></div>
      </div>
      <div class="head"></div>
      <div class="user-list"></div>
    </div>
  </div>
</template>

<script type="module">
  import { initMarquee } from '../../public/js/lando.js';

  const HERE = 7;
  const title = (inner = 'Anmeldung') => `<h2 class="t-title login-title">${inner}</h2>`;
  const hereCount = `<span class="here-count"><i></i><span class="num">${HERE}</span><span class="eyebrow">heute da</span></span>`;

  const VARIANTS = [
    { key: 'now', title: 'Jetzt', note: 'Stand nach D-126 und D-127', head: () => title() },
    { key: 'h1', title: 'H1 · Wer ist da', note: 'Rechts in der Titelzeile, wie viele heute schon da sind – erklärt nebenbei den Punkt. Kein Platz', head: () => title() + hereCount },
    { key: 'h2', title: 'H2 · Laufband', note: '„Anmeldung“ läuft langsam durch, getrennt von einem orangen Serif-Stern, wie die Laufbänder auf landonorris.com. Kein Platz', head: () => `<div class="marquee" data-marquee><div class="marquee-track">${title('<span>Anmeldung<span class="sep">✳</span></span><span>Anmeldung<span class="sep">✳</span></span>')}</div></div>` },
    { key: 'h3', title: 'H3 · Wochentag', note: 'Rechts der Wochentag in der orangen Serif – Abendgefühl, kein Platz', head: () => title() + `<span class="day">${new Date().toLocaleDateString('de-DE', { weekday: 'long' })}</span>` },
    { key: 'h4', title: 'H4 · Reiter', note: 'Die Linie über der Liste hebt sich wie ein Karteireiter um den Titel, mit Fläche darin (Kerben-Form der Karten). 10 px mehr', head: () => title() },
    { key: 'h5', title: 'H5 · Umriss füllt sich', note: 'Titel steht erst als Kontur da und füllt sich beim Öffnen von links (Idee D5). Nur Bewegung', head: () => `<h2 class="t-title login-title">Anmeldung<span class="fill" aria-hidden="true">Anmeldung</span></h2>` },
    { key: 'kombi', title: 'Kombi · H4 + H1', note: 'Mein Vorschlag: Reiter mit dem Titel, rechts auf der Linie „7 da“', head: () => title() + hereCount.replace('heute da', 'da'), ok: true, cls: ['h4'] },
  ];
  const PLAYERS = [['Basti', 1], ['Jule', 1], ['Flo', 1], ['Pauli', 0], ['Tom', 1], ['Nina', 0]];

  const stage = document.getElementById('stage');
  const tpl = document.getElementById('phone-tpl');
  for (const v of VARIANTS) {
    const sec = document.createElement('section');
    sec.className = 'variant';
    sec.innerHTML = `<div class="variant-head"><span class="t-h3">${v.title}</span><span class="eyebrow${v.ok ? ' ok' : ''}">${v.note}</span></div>`;
    const phone = tpl.content.firstElementChild.cloneNode(true);
    phone.classList.add(v.key, ...(v.cls ?? []));
    phone.querySelector('.head').innerHTML = v.head();
    const list = phone.querySelector('.user-list');
    for (const [n, here] of PLAYERS) {
      const item = document.createElement('div');
      item.className = 'user-item';
      item.innerHTML = `<div class="user-row"><span class="avatar-wrap"><span class="avatar">${n[0]}</span>${here ? '<span class="here-dot"></span>' : ''}</span><div class="user-name">${n}</div><span class="user-go"><span class="i-arrow"></span></span></div>`;
      list.append(item);
    }
    sec.append(phone);
    stage.append(sec);
  }

  document.querySelectorAll('[data-marquee]').forEach(initMarquee);

  // H4: Reiter-Linie und -Fläche um den Titel zeichnen (misst Titelbreite)
  function drawTabs() {
    document.querySelectorAll('.phone.h4 .head').forEach((head) => {
      head.querySelectorAll('.tab-line, .tab-fill').forEach((n) => n.remove());
      const w = head.offsetWidth, h = head.offsetHeight;
      const t = head.querySelector('.login-title');
      const tw = t.offsetLeft + t.offsetWidth + 16;   // Reiter endet 16 px hinter dem Titel
      const r = 12, s = 16;                            // Eckradius, Schräge
      const d = `M0 ${h} V${r} Q0 0 ${r} 0 H${tw - 4} Q${tw + 2} 0 ${tw + 5} 6 L${tw + s - 3} ${h - 6} Q${tw + s} ${h} ${tw + s + 6} ${h} H${w}`;
      const fill = document.createElement('span');
      fill.className = 'tab-fill';
      fill.style.width = `${tw + s + 8}px`;
      fill.style.clipPath = `path('M0 ${h} V${r} Q0 0 ${r} 0 H${tw - 4} Q${tw + 2} 0 ${tw + 5} 6 L${tw + s - 3} ${h - 6} Q${tw + s} ${h} ${tw + s + 6} ${h} Z')`;
      head.prepend(fill);
      head.insertAdjacentHTML('beforeend', `<svg class="tab-line" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>`);
    });
  }

  function play() {
    document.querySelectorAll('.phone.h5').forEach((ph) => { ph.classList.remove('play'); void ph.offsetWidth; ph.classList.add('play'); });
  }
  document.getElementById('replay').addEventListener('click', play);
  addEventListener('load', () => { drawTabs(); setTimeout(play, 200); });
  document.fonts?.ready.then(drawTabs);
</script>
</body>
</html>
