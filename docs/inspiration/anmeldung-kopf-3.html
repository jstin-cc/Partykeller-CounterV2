<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung Kopf 3</title>
<link rel="stylesheet" href="../../public/css/theme.css">
<style>
  body { padding: 48px clamp(16px, 4vw, 56px) 80px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
  .stage { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; }
  .variant { display: flex; flex-direction: column; gap: 14px; }
  .variant-head { display: flex; flex-direction: column; gap: 6px; width: 375px; }
  .variant-head .t-h3 { font-size: 18px; }
  .variant-head .eyebrow { color: var(--ink-muted); line-height: 1.4; }
  .variant-head .eyebrow.ok { color: var(--accent-text); }

  .phone {
    position: relative; width: 375px; height: 400px; flex: none; overflow: hidden;
    border-radius: 28px; border: 1px solid var(--line-strong); background: var(--bg);
  }
  .phone > .topo { z-index: 0; }
  .screen { position: absolute; inset: 0; z-index: 1; overflow: hidden; padding: 14px 20px 0; display: flex; flex-direction: column; }

  /* ---------- wie die echte Seite (D-126, D-127) ---------- */
  .bar { display: flex; justify-content: space-between; align-items: center; min-height: 48px; flex: none; }
  .bar .wordmark { font-size: 21px; }
  .bar-r { display: flex; align-items: center; gap: 12px; }
  .pk-logo {
    display: block; flex: none; width: 52px; aspect-ratio: 1181 / 1000; background: var(--ink);
    -webkit-mask: url('../../public/assets/logo.png') center / contain no-repeat;
    mask: url('../../public/assets/logo.png') center / contain no-repeat;
  }
  .head { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 22px 0 16px; flex: none; }
  .login-title { position: relative; z-index: 1; font-size: 34px; line-height: 0.86; white-space: nowrap; }
  .user-list { position: relative; z-index: 1; border-top: 1px solid var(--line); }
  .user-item { position: relative; border-bottom: 1px solid var(--line); }
  .user-row { display: flex; align-items: center; gap: 14px; min-height: 74px; padding: 12px 8px; color: var(--ink); }
  .user-name { flex: 1; min-width: 0; font-weight: 800; font-size: 27.75px; line-height: 0.92; letter-spacing: -0.035em; text-transform: uppercase; }
  .user-go { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; }
  .user-go .i-arrow { width: 12px; height: 12px; }
  .avatar-wrap { position: relative; flex: none; display: flex; }
  .here-dot { position: absolute; right: -1px; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2.5px var(--bg); }

  /* Wochentag in der Serif – Grundform aus Runde zwei */
  .day { position: relative; z-index: 1; font-family: var(--font-serif); font-size: 30px; line-height: 0.8; color: var(--accent-text); padding-bottom: 1px; white-space: nowrap; }

  /* H3a · mit Datum darüber */
  .day-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .day-stack .eyebrow { color: var(--ink-muted); }

  /* H3b · direkt am Titel */
  .h3b .head { justify-content: flex-start; gap: 10px; }

  /* H3c · schräg, mit Kringel */
  .h3c .day { font-size: 34px; rotate: -6deg; transform-origin: right bottom; margin-bottom: 2px; }
  .h3c .day .scribble--underline { position: absolute; left: -6%; width: 112%; bottom: -0.26em; height: 0.34em; --scribble-width: 2.2; }

  /* H3d · hell, mit Punkt davor */
  .h3d .day { color: var(--ink-2); display: flex; align-items: center; gap: 9px; }
  .h3d .day::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-top: 3px; }

  /* H3e · riesig und blass hinter dem Titel */
  .h3e .day-ghost {
    position: absolute; right: -18px; bottom: 2px; z-index: 0; pointer-events: none;
    font-family: var(--font-serif); font-size: 84px; line-height: 0.8; color: var(--topo-line); white-space: nowrap;
  }
</style>
</head>
<body>

<header class="page-head">
  <div>
    <p class="eyebrow">Entwurf · Anmeldeseite</p>
    <h1 class="t-title">Wochentag, <span class="t-serif t-accent">feiner</span></h1>
  </div>
  <button id="replay" class="btn btn--ghost btn--sm" type="button">Kringel abspielen <span class="i-arrow"></span></button>
</header>

<div class="stage" id="stage"></div>

<template id="phone-tpl">
  <div class="phone">
    <div class="topo topo--abs" aria-hidden="true"></div>
    <div class="screen">
      <div class="bar">
        <span class="wordmark"><span class="wm-top">Party</span><span class="wm-bottom">Keller</span></span>
        <div class="bar-r"><span class="pk-logo"></span><span class="btn btn--ghost btn--icon"><span class="i-menu"></span></span></div>
      </div>
      <div class="head"></div>
      <div class="user-list"></div>
    </div>
  </div>
</template>

<script type="module">
  import { scribble, drawScribble } from '../../public/js/lando.js';

  // Wochentag des Party-Abends: bis 6 Uhr früh zählt noch der Vortag (D-005),
  // wie „Di 29.09." im Dashboard
  const d = new Date();
  if (d.getHours() < 6) d.setDate(d.getDate() - 1);
  const DAY = d.toLocaleDateString('de-DE', { weekday: 'long' });
  const DATE = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + '.';

  const title = '<h2 class="t-title login-title">Anmeldung</h2>';
  const VARIANTS = [
    { key: 'h3', title: 'H3 · wie Runde zwei', note: 'Wochentag rechtsbündig in der orangen Serif', head: `${title}<span class="day">${DAY}</span>` },
    { key: 'h3a', title: 'H3a · Mit Datum', note: 'Darüber klein das Datum – wie „Di 29.09.“ im Dashboard. Gleiche Höhe', head: `${title}<span class="day-stack"><span class="eyebrow num">${DATE}</span><span class="day">${DAY}</span></span>` },
    { key: 'h3b', title: 'H3b · Direkt am Titel', note: 'Wochentag folgt dem Titel auf derselben Grundlinie, statt rechts zu stehen', head: `${title}<span class="day">${DAY}</span>` },
    { key: 'h3c', title: 'H3c · Schräg mit Kringel', note: 'Etwas größer, leicht schräg wie handgeschrieben, Kringel zeichnet sich darunter', head: `${title}<span class="day">${DAY}${scribble('underline')}</span>` },
    { key: 'h3d', title: 'H3d · Hell mit Punkt', note: 'Wochentag in Weiß, davor der orange Punkt aus der Liste – „heute“', head: `${title}<span class="day">${DAY}</span>` },
    { key: 'h3e', title: 'H3e · Riesig im Hintergrund', note: 'Wochentag zusätzlich groß und blass hinter der Titelzeile, rechts angeschnitten', head: `<span class="day-ghost" aria-hidden="true">${DAY}</span>${title}` },
  ];
  const PLAYERS = [['Basti', 1], ['Jule', 1], ['Flo', 1], ['Pauli', 0]];

  const stage = document.getElementById('stage');
  const tpl = document.getElementById('phone-tpl');
  for (const v of VARIANTS) {
    const sec = document.createElement('section');
    sec.className = 'variant';
    sec.innerHTML = `<div class="variant-head"><span class="t-h3">${v.title}</span><span class="eyebrow">${v.note}</span></div>`;
    const phone = tpl.content.firstElementChild.cloneNode(true);
    phone.classList.add(v.key);
    phone.querySelector('.head').innerHTML = v.head;
    const list = phone.querySelector('.user-list');
    for (const [n, here] of PLAYERS) {
      const item = document.createElement('div');
      item.className = 'user-item';
      item.innerHTML = `<div class="user-row"><span class="avatar-wrap"><span class="avatar">${n[0]}</span>${here ? '<span class="here-dot"></span>' : ''}</span><div class="user-name">${n}</div><span class="user-go"><span class="i-arrow"></span></span></div>`;
      list.append(item);
    }
    sec.append(phone);
    stage.append(sec);
  }
  const play = () => document.querySelectorAll('.scribble').forEach((s) => drawScribble(s, { restart: true, delay: 400 }));
  document.getElementById('replay').addEventListener('click', play);
  addEventListener('load', () => setTimeout(play, 200));
</script>
</body>
</html>
